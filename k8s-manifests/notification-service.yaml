---
# Source: stms-chart/templates/notification-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smart-task
spec:
  selector:
    app: notification-service
  ports:
    - port: 5003
      targetPort: 5003
---
# Source: stms-chart/templates/notification-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: sivavenkatasubramaniyan/stms-notification-service:v1
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/notificationdb"
