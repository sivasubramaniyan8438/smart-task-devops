---
# Source: stms-chart/templates/task-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: smart-task
spec:
  selector:
    app: task-service
  ports:
    - port: 5002
      targetPort: 5002
---
# Source: stms-chart/templates/task-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: sivavenkatasubramaniyan/stms-task-service:v1
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/taskdb"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-task-secret
                  key: JWT_SECRET
