---
# Source: stms-chart/templates/api-gateway.yaml
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-task
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
---
# Source: stms-chart/templates/api-gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: sivavenkatasubramaniyan/stms-api-gateway:v1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
