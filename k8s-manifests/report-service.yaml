---
# Source: stms-chart/templates/report-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: smart-task
spec:
  selector:
    app: report-service
  ports:
    - port: 5004
      targetPort: 5004
---
# Source: stms-chart/templates/report-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: sivavenkatasubramaniyan/stms-report-service:v1
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              value: "5004"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/reportdb"
