---
# Source: stms-chart/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-task
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30091
---
# Source: stms-chart/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sivavenkatasubramaniyan/stms-frontend:v1
          ports:
            - containerPort: 80
